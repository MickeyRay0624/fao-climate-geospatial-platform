name: Bug report
description: Report a reproducible defect in the platform prototype.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, signed URLs, restricted data or personal information.
  - type: textarea
    id: outcome
    attributes:
      label: Observed outcome
      description: What happened, including the stable error code and correlation ID when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Include route, persona, dataset state and exact actions without sensitive payloads.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or release
  - type: dropdown
    id: data_boundary
    attributes:
      label: Data boundary
      options:
        - Synthetic demonstration data
        - Demonstration field records
        - Real evaluation sample
        - No data involved
    validations:
      required: true
