name: Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install development checks
        run: python -m pip install -r api/requirements-dev.txt
      - name: Lint backend
        run: python -m ruff check api/app api/tests scripts
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start clean dependencies
        run: docker compose up -d db minio redis
      - name: Upgrade clean database and seed twice
        run: |
          docker compose run --rm migrate
          docker compose run --rm seed
          docker compose run --rm seed
          docker compose run --rm migrate alembic current
          docker compose run --rm migrate alembic heads
      - name: Prepare governed synthetic investment fixtures
        run: |
          docker compose run --rm --no-deps api python -m app.investment.backfill_legacy --verify --materialise-outputs
          docker compose up -d api worker
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              break
            fi
            sleep 5
          done
          curl -fsS http://localhost:8000/health >/dev/null
          python scripts/e2e_investment.py
          python scripts/e2e_investment.py
      - name: Run backend tests
        run: docker compose run --rm --no-deps api python -m pytest -q
      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color > backend-compose.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-compose-logs
          path: backend-compose.log
      - name: Stop services
        if: always()
        run: docker compose down
