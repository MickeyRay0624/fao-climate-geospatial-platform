name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install -r api/requirements.txt
      - name: Validate manifests, repository and migrations
        run: python scripts/check_contracts.py
      - name: Generate OpenAPI contract
        working-directory: api
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
        run: |
          python -c "from app.main import app; schema=app.openapi(); assert schema['openapi'].startswith('3.'); assert '/api/data/v1/datasets' in schema['paths']; assert '/api/apps/investment-prioritisation/v1/runs' in schema['paths']"
      - name: Validate Compose and whitespace
        run: |
          docker compose config --quiet
          git diff --check
