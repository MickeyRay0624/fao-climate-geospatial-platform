name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser test dependencies
        run: |
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps chromium
      - name: Start platform
        run: docker compose up -d --build
      - name: Wait for API and Web
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:3001/home >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Data Hub positive and negative controls
        run: |
          python scripts/e2e_datahub.py
          python scripts/e2e_negative_controls.py
      - name: Synthetic Investment smoke test
        run: python scripts/e2e_investment.py
      - name: Browser smoke tests
        run: npm --prefix web run test:e2e
      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color > e2e-compose.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-evidence
          path: |
            e2e-compose.log
            web/playwright-report/
            web/test-results/
      - name: Stop services
        if: always()
        run: docker compose down
